[build]
  functions = "functions"

[dev]
  functions = "functions"

[[redirects]]
  from = "/holidays/:year"
  to = "/.netlify/functions/holidays?year=:year"
  status = 200
  force = true

[[redirects]]
  from = "/api/holidays/:year"
  to = "/.netlify/functions/holidays?year=:year"
  status = 200
  force = true

# Asegura que el módulo compartido se empaquete junto con la función.
[functions]
  included_files = ["lib/**"]

# Cabeceras de seguridad básicas para la landing y la API.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
